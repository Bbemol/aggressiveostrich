<!doctype html>
<html lang="fr">
  <head>

    <meta
      name="description"
      content="Tous les liens officiels de votre groupe de musique."

    <link rel="stylesheet" href="styles/design-system.css" />

          src="https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=240&q=80"

          <a class="link-card__main" href="https://example.com/night-driver" target="_blank" rel="noreferrer">
            <img
              class="link-card__thumb"
              src="https://images.unsplash.com/photo-1506157786151-b8491531f063?auto=format&fit=crop&w=220&q=80"
              alt="Miniature du single Night Driver"
            />

          </a>

        <article class="link-card" data-title="Billetterie tournée 2026" data-url="https://example.com/tour-2026">
          <a class="link-card__main" href="https://example.com/tour-2026" target="_blank" rel="noreferrer">
            <img
              class="link-card__thumb"
              src="https://images.unsplash.com/photo-1501612780327-45045538702b?auto=format&fit=crop&w=220&q=80"
              alt="Miniature de la tournée 2026"
            />

          </a>

        <article class="link-card" data-title="Merch officiel" data-url="https://example.com/merch">

              class="link-card__thumb"
              src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=220&q=80"
